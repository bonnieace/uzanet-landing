name: Recover landing source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-landing-source.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out standalone repository
        uses: actions/checkout@v5
        with:
          path: target
          fetch-depth: 0

      - name: Check out authoritative backend source
        uses: actions/checkout@v5
        with:
          repository: bonnieace/Mikrotik
          ref: main
          path: source

      - name: Restore recovered baseline
        run: |
          cp -a source/uzanet-landing/. target/
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Restore complete recovered landing files"
            git push origin HEAD:main
          fi

      - name: Restore production-branch assets
        run: |
          cd target
          git fetch origin fix/landing-production-sanity
          git switch fix/landing-production-sanity
          cp -a ../source/uzanet-landing/public/. public/
          git add public
          if ! git diff --cached --quiet; then
            git commit -m "Restore complete recovered landing assets"
            git push origin HEAD:fix/landing-production-sanity
          fi
